<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매매일지</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;background:#f4f6f9;color:#1e293b;display:flex;min-height:100vh}
aside{width:250px;background:#0f172a;color:#e2e8f0;padding:16px;flex-shrink:0;overflow-y:auto;height:100vh;position:sticky;top:0}
aside h1{font-size:16px;margin:0 0 10px}aside a{display:block;padding:8px 10px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-size:13px;margin-bottom:4px}
aside a.on{background:#2563eb;color:#fff}aside small{display:block;color:#94a3b8;font-size:11px}aside a.on small{color:#dbeafe}
aside button{width:100%;margin:6px 0}#stats{font-size:12px;color:#94a3b8;margin-top:10px}
main{flex:1;min-width:0;padding:20px;max-width:800px}main h1{font-size:19px}
details{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-bottom:10px}summary{font-weight:700;cursor:pointer}
label{display:block;font-size:12px;color:#64748b;margin-top:10px}input,textarea,select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin-top:4px}textarea{min-height:70px}
button{font:inherit;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}.del{background:#e11d48;margin-top:8px}
#calc{background:#eff6ff;border-radius:8px;padding:8px 12px;font-size:13px;min-height:34px}.note{font-size:12px;color:#64748b}
@media(max-width:700px){body{flex-direction:column}aside{width:100%;height:auto;position:static}}
</style></head>
<body>
<aside><h1>📒 매매일지</h1><a href="index.html">← 시황 아카이브</a>
<button onclick="newCard()">+ 새 매매 카드</button><div id="list"></div>
<button onclick="exportJson()">백업 내보내기</button>
<label>백업 가져오기<input type="file" accept=".json" onchange="importJson(this)"></label>
<div id="stats"></div></aside>
<main id="view"></main>
<script>
// 단계 정의: [저장이름, 화면에 보일 질문, 입력 종류]
const STAGES = [
 {t:'① 내러티브 · 호재 발견', f:[['stock','종목','text'],['date','발견일','date'],['narr','무슨 이야기인가? 왜 돈이 몰리나?','area'],['src','출처(시황 날짜·뉴스)','text']]},
 {t:'② 시나리오 작성', f:[['bull','낙관 시나리오','area'],['base','기본 시나리오','area'],['bear','비관 시나리오','area'],['inval','이 이야기가 틀렸다고 판단할 조건(무효화)','area']]},
 {t:'③ 타점 선정', f:[['entry','진입가','num'],['stop','손절가','num'],['target','목표가','num'],['size','비중(%)','num']]},
 {t:'④ 매매 수행(매수)', f:[['bdate','체결일','date'],['bprice','실제 체결가','num'],['bnote','체결 메모','area']]},
 {t:'⑤ 복기1 (보유 중)', f:[['planok','계획대로 진입했나?','sel:예,부분적으로,아니오'],['rev1','시나리오 진행 상황, 흔들렸던 점','area']]},
 {t:'⑥ 매도 수행', f:[['sdate','매도일','date'],['sprice','실제 매도가','num'],['why','매도 사유','sel:목표 도달,손절,시나리오 무효,시간 경과,기타']]},
 {t:'⑦ 복기2 · 기록', f:[['cause','결과의 원인','sel:시나리오 적중,타이밍 우수,시나리오 오류,타이밍 오류,원칙 위반,운·외부변수'],['rev2','배운 점 · 다음에 바꿀 한 가지','area']]}
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T = (() => { try { return JSON.parse(localStorage.getItem('mlab:trades')) || []; } catch (e) { return []; } })();
let sel = null;
const save = () => { try { localStorage.setItem('mlab:trades', JSON.stringify(T)); } catch (e) {} };
const cur = () => T.find(c => c.id === sel);
const stageOf = c => { let n = 0; STAGES.forEach((s, i) => { if (s.f.some(f => c[f[0]])) n = i + 1; }); return n; };

function calc(c) {  // 입력값으로 자동 계산
  const e = +c.entry, s = +c.stop, t = +c.target, b = +c.bprice, x = +c.sprice, o = [];
  if (e && s && t && e > s) o.push(`계획 손익비 ${((t - e) / (e - s)).toFixed(2)} : 1`);
  if (b && x) { o.push(`수익률 ${((x - b) / b * 100).toFixed(2)}%`); if (s && b > s) o.push(`R배수 ${((x - b) / (b - s)).toFixed(2)}R`); }
  return o.join(' · ') || '타점·체결가를 입력하면 손익비와 수익률이 자동 계산됩니다';
}
function field([k, label, type], v) {
  let i;
  if (type === 'area') i = `<textarea data-k="${k}">${esc(v)}</textarea>`;
  else if (type.startsWith('sel:')) i = `<select data-k="${k}"><option></option>${type.slice(4).split(',').map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  else i = `<input data-k="${k}" type="${type === 'num' ? 'number' : type}" step="any" value="${esc(v)}">`;
  return `<label>${label}${i}</label>`;
}
function renderList() {
  $('list').innerHTML = T.map(c => `<a href="#" class="${c.id === sel ? 'on' : ''}" onclick="sel=${c.id};render();return false">${esc(c.stock || '(종목 미입력)')}<small>${stageOf(c) === 7 ? '✅ 완료' : '진행 ' + stageOf(c) + '/7'}</small></a>`).join('');
  const d = T.filter(c => +c.bprice && +c.sprice), r = d.map(c => (c.sprice - c.bprice) / c.bprice * 100);
  $('stats').textContent = d.length ? `청산 ${d.length}건 · 승률 ${(r.filter(x => x > 0).length / d.length * 100).toFixed(0)}% · 평균 ${(r.reduce((a, b) => a + b) / d.length).toFixed(2)}%` : '청산된 매매 없음';
}
function render() {
  renderList();
  const c = cur();
  if (!c) { $('view').innerHTML = '<p>왼쪽에서 카드를 고르거나 <b>+ 새 매매 카드</b>를 누르세요.</p><p class="note">기록은 이 브라우저에만 저장됩니다. 주기적으로 [백업 내보내기]를 눌러 파일로 보관하세요.</p>'; return; }
  const open = Math.min(stageOf(c), 6);
  $('view').innerHTML = `<h1>${esc(c.stock || '새 카드')}</h1><p id="calc">${calc(c)}</p>` +
    STAGES.map((s, i) => `<details ${i === open ? 'open' : ''}><summary>${s.t}</summary>${s.f.map(f => field(f, c[f[0]])).join('')}</details>`).join('') +
    '<button class="del" onclick="del()">카드 삭제</button>';
}
$('view').addEventListener('input', e => {  // 입력할 때마다 자동 저장
  const c = cur(), k = e.target.dataset.k; if (!c || !k) return;
  c[k] = e.target.value; save(); $('calc').textContent = calc(c); renderList();
});
function newCard(pre = {}) { const c = { id: Date.now(), ...pre }; T.unshift(c); sel = c.id; save(); render(); }
function del() { if (confirm('이 카드를 삭제할까요?')) { T = T.filter(c => c.id !== sel); sel = T[0]?.id; save(); render(); } }
function exportJson() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(T, null, 1)], { type: 'application/json' })); a.download = 'trades-backup.json'; a.click(); }
function importJson(i) {
  const f = i.files[0]; if (!f || !confirm('현재 기록을 가져온 파일 내용으로 덮어씁니다. 계속할까요?')) return;
  f.text().then(t => { try { const a = JSON.parse(t); if (Array.isArray(a)) { T = a; save(); sel = T[0]?.id; render(); } } catch (e) { alert('파일 형식이 올바르지 않습니다.'); } });
}
const q = new URLSearchParams(location.search);   // 시황 페이지의 [카드 만들기]에서 넘어온 경우
if (q.get('stock')) { newCard({ stock: q.get('stock'), narr: q.get('narr') || '', date: q.get('date') || '', src: q.get('date') ? q.get('date') + ' 시황' : '' }); history.replaceState(null, '', 'journal.html'); }
else { sel = T[0]?.id; render(); }
</script></body></html>
