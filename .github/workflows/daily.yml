name: daily-market

on:
  schedule:
    - cron: "30 8 * * 1-5"      # UTC 08:30 = 한국 17:30, 평일만 (장 마감 후)
  workflow_dispatch:             # Actions 탭에서 수동 실행
    inputs:
      date:
        description: "수집할 날짜 YYYY-MM-DD (비우면 오늘)"
        required: false
  push:                          # 사람이 코드·데이터를 고쳐 올렸을 때는 수집 없이 재배포만
    branches: [main]
    paths: ["template.html", "journal.html", "generate.py", "data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시황 수집 (휴장일이면 저장 없이 종료)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: python collect.py ${DATE_INPUT:+--date "$DATE_INPUT"}

      - name: 수집 결과 저장 (commit)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: 일일 시황 자동 수집" && git push)

      - name: 웹페이지(index.html) 생성
        run: python generate.py

      - name: 배포용 폴더 구성
        run: |
          mkdir site
          cp index.html journal.html site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
