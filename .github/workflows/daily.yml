name: deploy-site

# 수집은 고정 IP 서버(server/ 폴더)가 하고, 여기서는 data 폴더가 바뀔 때마다 사이트만 다시 만들어 배포합니다.
on:
  push:
    branches: [main]
    paths: ["template.html", "journal.html", "generate.py", "data/**"]
  workflow_dispatch:             # Actions 탭에서 수동으로 다시 배포

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 웹페이지(index.html) 생성
        run: python generate.py

      - name: 배포용 폴더 구성
        run: |
          mkdir site
          cp index.html journal.html site/
          if [ -d data/stocks ]; then cp -r data/stocks site/stocks; fi   # 종목 상세 팝업이 읽는 파일

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
