<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데일리 시황 아카이브</title>
<style>
:root{--ink:#1e293b;--ink2:#475569;--muted:#94a3b8;--line:#e2e8f0;--grid:#eef2f7;--surface:#fff;--bg:#f4f6f9;--accent:#2563eb;
  --up:#e11d48;--dn:#2563eb;--flat:#cbd5e1;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:240px;background:#0f172a;color:#e2e8f0;padding:16px;flex-shrink:0;overflow-y:auto;height:100vh;position:sticky;top:0}
aside h1{font-size:16px;margin:0 0 12px}aside a{display:block;padding:8px 10px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-size:13px;margin-bottom:4px}
aside a.on{background:var(--accent);color:#fff}aside small{display:block;color:#94a3b8;font-size:11px}aside a.on small{color:#dbeafe}
main{flex:1;min-width:0;padding:20px;max-width:1120px}main h1{font-size:19px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px;border-left:4px solid var(--accent);padding-left:8px}h3{font-size:14px;margin:18px 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}th{background:#f8fafc;color:#64748b;font-size:12px}
td:first-child,th:first-child{white-space:nowrap}section ul,section ol{font-size:14px;line-height:1.6;padding-left:20px}
.up{color:var(--up);font-weight:700}.dn{color:var(--dn);font-weight:700}.mut{color:#64748b;font-size:12px}
textarea{width:100%;min-height:70px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:8px 0}
select,button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1}button{background:var(--accent);color:#fff;border:0;cursor:pointer}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.tab{padding:6px 12px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-size:13px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}.tab.off{color:#94a3b8;border-style:dashed}.tabs small{color:#64748b;font-size:12px;margin-left:6px}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{background:#fff;color:#334155;border:1px solid #cbd5e1;padding:3px 10px;font-size:12px;border-radius:999px}
.seg button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.memo{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;font-size:13px;white-space:pre-wrap}
/* 종목 표 */
.stk{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--muted);cursor:pointer;background:none;padding:0;font:inherit;font-weight:700;border-radius:0}
.stk:hover{color:var(--accent);border-color:var(--accent)}
.mk{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:1px;border:1px solid}
.mk.p{color:#334155;border-color:#94a3b8;background:#f1f5f9}.mk.q{color:#7c2d12;border-color:#fdba74;background:#fff7ed}
.ratio{display:inline-block;white-space:nowrap;font-size:11px;padding:0 6px;border-radius:6px;background:#f1f5f9;color:var(--ink2);margin-top:2px}
.ratio.hot{background:#fee2e2;color:#9f1239;font-weight:700}
.news{margin:0;padding:0;list-style:none;font-size:12.5px;line-height:1.45}.news li{margin-bottom:4px}
.news a,.hl a{color:var(--ink);text-decoration:none}.news a:hover,.hl a:hover{color:var(--accent);text-decoration:underline}.news small{color:var(--muted)}
.hl{font-size:12px;margin-top:4px;line-height:1.4}.hl small{color:var(--muted)}
/* 차트 공통 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.card h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.card h4 small{font-weight:400;color:#64748b;font-size:11.5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
svg text{font-family:inherit}#tip{position:fixed;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;padding:6px 8px;border-radius:6px;z-index:60;display:none;max-width:280px;line-height:1.5}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.ch{position:relative;touch-action:pan-y}.ch.zoomable{cursor:zoom-in}.ch.zoomable:hover{outline:1px dashed #cbd5e1;outline-offset:3px;border-radius:6px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{flex:1;min-width:170px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile>b{display:block;font-size:20px;margin:2px 0}.tile small{color:#64748b;font-size:11.5px;display:block}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:#fff}
.chip.in{border-color:var(--accent);background:#eff6ff;font-weight:700}
details summary{cursor:pointer;font-size:12px;color:var(--accent);margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}
.kv div{background:#f8fafc;border-radius:8px;padding:8px 10px}.kv small{display:block;color:#64748b;font-size:11px}.kv b{font-size:15px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.btns a{font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid #cbd5e1;color:var(--ink);text-decoration:none;background:#fff}
.btns a.nv{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}
/* 히트맵 */
#heat{position:relative;width:100%;background:#fff;border-radius:8px;overflow:hidden}
.hs{position:absolute;border:1px solid #fff;overflow:hidden}.hs>span{position:absolute;left:3px;top:1px;font-size:10.5px;font-weight:700;color:#334155;white-space:nowrap;z-index:1}
.ht{position:absolute;border:1px solid #fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1e293b;line-height:1.15;overflow:hidden}
.ht:hover{outline:2px solid #0f172a;z-index:2}.ht b{font-weight:700}.ht small{font-size:.85em}
.hscale{display:flex;gap:2px;align-items:center;font-size:11px;color:#64748b;margin:6px 0}.hscale span{width:34px;height:12px;border-radius:2px;display:inline-block}
/* 뉴스 */
.ncat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.ncat h4{margin:0 0 6px;font-size:13px}
.ncat ol{margin:0;padding-left:18px;font-size:13px;line-height:1.5}.ncat li{margin-bottom:6px}
.ncat a{color:var(--ink);text-decoration:none}.ncat a:hover{color:var(--accent);text-decoration:underline}
.nb{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:999px;background:#eef2ff;color:#3730a3;margin-left:4px;white-space:nowrap}
.nb.hot{background:#fee2e2;color:#9f1239;font-weight:700}
/* 상세 팝업 */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:50;padding:24px 12px;overflow-y:auto}
#modal .box{background:#fff;max-width:960px;margin:0 auto;border-radius:14px;padding:18px 20px;position:relative}
#modal .x{position:absolute;right:12px;top:10px;background:#f1f5f9;color:var(--ink);border-radius:999px;width:32px;height:32px;padding:0}
.biz{font-size:13.5px;line-height:1.7;white-space:pre-line;background:#f8fafc;border-radius:8px;padding:10px 12px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;max-height:220px}main{padding:12px}th,td{padding:6px 5px;font-size:12px}.grid2,.grid3{grid-template-columns:1fr}#modal .box{padding:16px 12px}}
</style></head>
<body>
<aside><h1>📈 데일리 시황</h1><div id="nav"></div><a href="journal.html" style="margin-top:12px;border:1px solid #334155">📒 매매일지</a></aside>
<main id="view"></main>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="x" onclick="closeModal()" aria-label="닫기">✕</button><div id="mbody"></div></div></div>
<div id="tip"></div>
<script>
const DAYS = /*__DATA__*/[];   // generate.py 가 날짜 목록을 넣습니다. 날짜별 자료는 days/날짜.json 을 필요할 때 불러옵니다.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => `<span class="${String(v).trim().startsWith('-') ? 'dn' : 'up'}">${esc(v)}</span>`;
const pctn = v => v == null ? '-' : pct((v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%');
const NS = 'mlab:';
const load = k => { try { return JSON.parse(localStorage.getItem(NS + k)) || []; } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} };
const L = a => Array.isArray(a) ? a : [];
const tbl = (head, rows) => !rows.length ? '<p class="mut">수집된 데이터가 없습니다.</p>' : '<div style="overflow-x:auto"><table><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr>' + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table></div>';
const sec = (t, h, id) => `<section${id ? ` id="${id}"` : ''}><h2>${t}</h2>${h}</section>`;
const SN = { noon: '1차 12:00', close: '2차 17:30', nxt: '3차 20:00' };
const WHO = [['개인', 'var(--s1)'], ['외국인', 'var(--s2)'], ['기관', 'var(--s3)']];
const COL = { '코스피': 'var(--s1)', '코스닥': 'var(--s2)' };
const eok = v => { const a = Math.abs(v) / 1e8; const s = v < 0 ? '-' : (v > 0 ? '+' : ''); return a >= 10000 ? `${s}${(a / 10000).toFixed(2)}조` : `${s}${Math.round(a).toLocaleString()}억`; };
const won0 = v => eok(v).replace('+', '');
const NAVER = c => ({ chart: `https://finance.naver.com/item/fchart.naver?code=${c}`, main: `https://finance.naver.com/item/main.naver?code=${c}` });
let cur = null, sel = null, DAY = null, NEWS = null, SER = null, HEAT = null;
const UI = { flowMk: '코스피', flowWho: '외국인', amtMk: '코스피', heatMk: '코스피', news: null };

/* ── 파일 불러오기(한 번 받은 파일은 기억) ── */
const _cache = {};
function getJ(u) { if (!(u in _cache)) _cache[u] = fetch(u, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null); return _cache[u]; }

/* ── 마우스 툴팁: data-tip 요소, 차트(.ch) ── */
const tip = (html, e) => { const t = $('tip'); t.innerHTML = html; t.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8), y = e.clientY + 16 + t.offsetHeight > innerHeight ? e.clientY - t.offsetHeight - 10 : e.clientY + 16;
  t.style.left = x + 'px'; t.style.top = y + 'px'; };
function onMove(e) {
  const c = e.target.closest && e.target.closest('.ch');
  document.querySelectorAll('.guide').forEach(g => { if (!c || !c.contains(g)) g.setAttribute('visibility', 'hidden'); });
  if (c && CH[c.dataset.ch]) { chartHover(c, e); return; }
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { $('tip').style.display = 'none'; return; }
  tip(t.getAttribute('data-tip'), e);
}
document.addEventListener('mousemove', onMove);
document.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') onMove(e); });

/* ───────── 차트 엔진(SVG) ─────────
   spec = {type:'line'|'bar', x:[날짜], series:[{name,color,v:[값|null]}], fmt:값→글자, bands:[{y0,y1,fill,label}],
           yMin,yMax, title, zoom:true, mini:true, extra:(i)=>툴팁 추가 글, range:기본 표시 개수} */
const CH = {}; let chSeq = 0;
const CW = () => innerWidth < 760 ? 380 : 640;   // 좁은 화면은 좌표 폭을 줄여 글자가 작아지지 않게
function chart(spec, W = CW(), H = 190) {
  const id = 'c' + (++chSeq); CH[id] = spec;
  const n = spec.range ? Math.min(spec.range, spec.x.length) : spec.x.length;
  return `<div class="ch ${spec.zoom ? 'zoomable' : ''}" data-ch="${id}" data-n="${n}" ${spec.zoom ? `onclick="zoomChart('${id}')"` : ''}>${drawChart(spec, W, spec.mini ? 64 : H, n)}</div>`;
}
function drawChart(sp, W, H, n) {
  const x = sp.x.slice(-n), ser = sp.series.map(s => ({ ...s, v: s.v.slice(-n) }));
  if (!x.length) return '<p class="mut">자료 수집 중</p>';
  const mini = sp.mini, Lm = mini ? 4 : 50, Rm = mini ? 4 : 10, T = mini ? 4 : 10, B = mini ? 4 : 22;
  const vals = ser.flatMap(s => s.v).filter(v => v != null && isFinite(v));
  let lo = sp.yMin ?? Math.min(...vals), hi = sp.yMax ?? Math.max(...vals);
  if (sp.type === 'bar') { lo = Math.min(0, lo); hi = Math.max(0, hi); }
  L(sp.bands).forEach(b => { if (sp.yMin == null && b.y0 != null && b.y0 > -1e9) lo = Math.min(lo, b.y0 - (b.pad || 0)); if (sp.yMax == null && b.y1 != null && b.y1 < 1e9) hi = Math.max(hi, b.y1 + (b.pad || 0)); });
  if (hi === lo) { hi += 1; lo -= 1; }
  const padv = (hi - lo) * (sp.type === 'bar' || sp.yMin != null ? 0 : 0.06); lo -= sp.yMin != null ? 0 : padv; hi += sp.yMax != null ? 0 : padv;
  const pw = W - Lm - Rm, ph = H - T - B, X = i => Lm + (n === 1 ? pw / 2 : i / (x.length - 1 || 1) * pw), Y = v => T + (hi - v) / (hi - lo) * ph;
  let g = '';
  L(sp.bands).forEach(b => { const y0 = Math.max(lo, b.y0 ?? lo), y1 = Math.min(hi, b.y1 ?? hi); if (y1 > y0) {
    g += `<rect x="${Lm}" y="${Y(y1)}" width="${pw}" height="${Y(y0) - Y(y1)}" fill="${b.fill}"/>`;
    if (!mini && b.label) g += `<text x="${W - Rm - 4}" y="${Y(y1) + 12}" font-size="10" text-anchor="end" fill="#64748b">${b.label}</text>`; } });
  if (!mini) {
    [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1].forEach(v => { g += `<line x1="${Lm}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef2f7"/><text x="${Lm - 6}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="#64748b">${sp.fmt(v, true)}</text>`; });
    [0, Math.floor((x.length - 1) / 2), x.length - 1].filter((v, i, a) => a.indexOf(v) === i).forEach((i, k, a) => { g += `<text x="${X(i)}" y="${H - 6}" font-size="10" text-anchor="${a.length === 1 ? 'middle' : ['start', 'middle', 'end'][k]}" fill="#64748b">${esc(String(x[i]).slice(2))}</text>`; });
  }
  if (sp.type === 'bar') {
    const bw = Math.max(1, Math.min(14, pw / x.length * 0.72)), y0 = Y(0);
    g += `<line x1="${Lm}" x2="${W - Rm}" y1="${y0}" y2="${y0}" stroke="#94a3b8"/>`;
    ser[0].v.forEach((v, i) => { if (v == null) return; const yy = Math.min(Y(v), y0), hh = Math.max(1, Math.abs(Y(v) - y0));
      g += `<rect x="${X(i) - bw / 2}" y="${yy}" width="${bw}" height="${hh}" rx="${bw > 5 ? 2 : 0}" fill="${typeof ser[0].color === 'function' ? ser[0].color(v) : ser[0].color}"/>`; });
  } else {
    ser.forEach(s => { let d = '', pen = false; s.v.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); pen = true; });
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${mini ? 1.6 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (sp.marks) s.v.forEach((v, i) => { const m = sp.marks(sp.x.length - x.length + i); if (m && v != null) g += `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${m}" stroke="#fff" stroke-width="1.5"/>`; });
      const li = s.v.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
      if (li != null && li >= 0) g += `<circle cx="${X(li)}" cy="${Y(s.v[li])}" r="${mini ? 2.5 : 3.5}" fill="${s.color}"/>`; });
  }
  g += `<line class="guide" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#0f172a" stroke-dasharray="3 3" visibility="hidden"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" data-l="${Lm}" data-r="${Rm}" data-w="${W}" role="img" aria-label="${esc(sp.title || '차트')}">${g}</svg>`;
}
function chartHover(c, e) {
  const sp = CH[c.dataset.ch], svg = c.querySelector('svg'); if (!svg) return;
  const n = +c.dataset.n, x = sp.x.slice(-n), r = svg.getBoundingClientRect(), W = +svg.dataset.w, Lm = +svg.dataset.l, Rm = +svg.dataset.r;
  const sx = (e.clientX - r.left) / r.width * W, i = Math.max(0, Math.min(x.length - 1, Math.round((sx - Lm) / (W - Lm - Rm) * (x.length - 1))));
  const gx = Lm + (x.length === 1 ? (W - Lm - Rm) / 2 : i / (x.length - 1) * (W - Lm - Rm)), gl = svg.querySelector('.guide');
  gl.setAttribute('x1', gx); gl.setAttribute('x2', gx); gl.setAttribute('visibility', 'visible');
  const gi = sp.x.length - n + i;
  let h = `<b>${esc(x[i])}</b>`;
  sp.series.forEach(s => { const v = s.v[gi]; if (v != null) h += `<br><i style="background:${typeof s.color === 'function' ? s.color(v) : s.color}"></i>${esc(s.name)} <b>${sp.fmt(v)}</b>`; });
  if (sp.extra) h += sp.extra(gi);
  tip(h, e);
}
function zoomChart(id, n) {
  const sp = CH[id]; if (!sp) return;
  n = n || Math.min(sp.x.length, Math.max(sp.range || 0, 120));
  const opts = [[20, '1달'], [60, '3달'], [120, '6달'], [250, '1년'], [sp.x.length, '전체']].filter(([k], i, a) => k <= sp.x.length || i === a.length - 1);
  const z = 'z' + (++chSeq); CH[z] = { ...sp, zoom: false, mini: false };
  openModal(`<h2>${esc(sp.title || '차트')}</h2>${sp.legend || ''}<div class="seg" style="margin:4px 0 8px">${opts.map(([k, l], i) => `<button class="${i === opts.findIndex(o => o[0] >= n) ? 'on' : ''}" onclick="zoomChart('${id}',${k})">${l}</button>`).join('')}</div>
    <div class="ch" data-ch="${z}" data-n="${Math.min(n, sp.x.length)}">${drawChart(CH[z], innerWidth < 760 ? 420 : 900, innerWidth < 760 ? 300 : 400, Math.min(n, sp.x.length))}</div>
    ${sp.note ? `<p class="mut">${sp.note}</p>` : ''}${sp.zoomExtra ? sp.zoomExtra() : ''}<p class="mut">차트 위에서 마우스를 움직이면 그날의 값이 보입니다. 뒤로가기(←)나 ✕로 닫습니다.</p>`);
}
const legend = items => `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>`;

/* ── 팝업(뒤로가기로 닫힘) ── */
function openModal(html) {
  $('tip').style.display = 'none';
  $('mbody').innerHTML = html; $('modal').style.display = 'block'; document.body.style.overflow = 'hidden'; $('modal').scrollTop = 0;
  if (!(history.state && history.state.m)) history.pushState({ m: 1 }, '');
}
function hideModal() { $('modal').style.display = 'none'; document.body.style.overflow = ''; $('tip').style.display = 'none'; }
function closeModal() { if (history.state && history.state.m) history.back(); else hideModal(); }
window.addEventListener('popstate', () => { if (!(history.state && history.state.m)) hideModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').style.display === 'block') closeModal(); });

/* ───────── 시계열 계산 ───────── */
function upto(rows) { return rows.filter(r => r[0] <= cur); }
function rsi(cl, p = 14) {
  const out = cl.map(() => null); if (cl.length <= p) return out;
  let g = 0, l = 0;

  const W = 460, lab = 64, pad = 54, mid = lab + (W - lab) / 2, half = (W - lab) / 2 - pad, bh = 12, gap = 4, grp = 3 * bh + 2 * gap + 16;

/* ── 상승·보합·하락 막대 ── */
function breadthBar(mk, b) {

  const bars = parts.filter(p => p[1] > 0).map(([n, v, c]) => `<span data-tip="${mk} ${n} <b>${v}</b>종목 (${(v / tot * 100).toFixed(1)}%)" style="flex:${v};background:${c};height:18px;border-radius:3px"></span>`).join('');
  const lim = (b.upper != null ? ` · 상한가 <b class="up">${b.upper}</b>` : '') + (b.lower != null ? ` · 하한가 <b class="dn">${b.lower}</b>` : '');

/* ── 히트맵(시가총액 크기, 업종별 묶음) ── */

  const t = Math.min(1, Math.abs(p) / 6), mix = (a, b) => Math.round(a + (b - a) * t);
  return p > 0 ? `rgb(${mix(254, 248)},${mix(232, 113)},${mix(232, 113)})` : `rgb(${mix(226, 96)},${mix(236, 165)},${mix(252, 250)})`;
}
function squarify(items, x, y, w, h) {

    else { const chh = sum / rw; let xx = rx; row.forEach(r => { const ww = r.a / chh; out.push({ ...r, x: xx, y: ry, w: ww, h: chh }); xx += ww; }); ry += chh; rh -= chh; }
    row = []; };

/* ───────── 종목 상세 팝업 ───────── */
function finChart(f, ser) {
  const vals = ser.flatMap(([, k]) => L(f[k]).filter(v => v != null));
  if (!vals.length) return '<p class="mut">재무 수치를 찾지 못했습니다.</p>';
  const W = 300, H = 190, top = 18, bot = 24, left = 4, max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const y = v => top + (max - v) / ((max - min) || 1) * (H - top - bot), y0 = y(0);
  const gw = (W - left) / 3, bw = Math.min(24, gw / 5);
  let g = `<line x1="${left}" x2="${W}" y1="${y0}" y2="${y0}" stroke="#94a3b8"/>`;
  f.years.forEach((yr, i) => {
    const cx = left + gw * i + gw / 2;
    g += `<text x="${cx}" y="${H - 6}" font-size="12" text-anchor="middle" fill="#475569">${yr}</text>`;
    ser.forEach(([n, k, c], j) => {
      const v = L(f[k])[i]; if (v == null) return;
      const x = cx + (j - (ser.length - 1) / 2) * (bw + 2) - bw / 2, yy = Math.min(y(v), y0), hgt = Math.max(1, Math.abs(y(v) - y0));
      g += `<rect x="${x}" y="${yy}" width="${bw}" height="${hgt}" rx="3" fill="${c}" data-tip="${yr} ${n}<br><b>${won0(v)}</b>"/>`;
      if (j === 0) g += `<text x="${x + bw / 2}" y="${v >= 0 ? yy - 4 : yy + hgt + 11}" font-size="10" text-anchor="middle" fill="#334155">${won0(v)}</text>`;
    });
  });
  return `${legend(ser.map(([n, , c]) => [n, c]))}<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 3년 재무">${g}</svg>`;
}
function finTable(f) {
  const cell = (k, i) => L(f[k])[i] != null ? won0(f[k][i]) : '-';
  const rate = (a, b, i) => (L(f[a])[i] != null && L(f[b])[i]) ? (f[a][i] / f[b][i] * 100).toFixed(1) + '%' : '-';
  return tbl(['항목', ...f.years.map(String)], [
    ['매출액', ...[0, 1, 2].map(i => cell('revenue', i))], ['영업이익', ...[0, 1, 2].map(i => cell('op', i))],
    ['순이익', ...[0, 1, 2].map(i => cell('net', i))], ['영업이익률', ...[0, 1, 2].map(i => rate('op', 'revenue', i))],
    ['부채비율', ...[0, 1, 2].map(i => rate('liab', 'equity', i))], ['자본총계', ...[0, 1, 2].map(i => cell('equity', i))]]);
}
function priceChart(info) {
  const p = L(info.prices); if (p.length < 2) return '<p class="mut">주가 자료 없음 — 위의 네이버 차트 버튼으로 확인하세요.</p>';
  const byDate = {}; L(info.appear).forEach(a => (byDate[a.date] = byDate[a.date] || []).push(a));
  return chart({ type: 'line', title: `${info.name} 종가(수정주가)`, x: p.map(r => r[0]), series: [{ name: '종가', color: 'var(--s1)', v: p.map(r => r[1]) }],
    fmt: v => Math.round(v).toLocaleString(), marks: i => byDate[p[i][0]] ? (String(byDate[p[i][0]][0].price).startsWith('-') ? 'var(--dn)' : 'var(--up)') : null, extra: i => (p[i][2] ? `<br>거래대금 ${won0(p[i][2])}` : '') + (byDate[p[i][0]] ? '<br>' + byDate[p[i][0]].map(z => `★ ${esc(z.label)} ${esc(z.price)}`).join('<br>') : '') }, CW(), 220)
    + `<p class="mut">점 = 이 사이트 목록에 등장한 날(빨강 상승·파랑 하락). 마우스를 올리면 그날 종가·거래대금·등장 목록.</p>`;
}
function heatRow(code) { const r = HEAT && HEAT.rows.find(x => x[0] === code); return r ? { per: r[6], pbr: r[7], roe: r[8], rs: r[9], sector: r[3], cap: r[4] * 1e8, market: r[2], name: r[1], price: r[10], pct: r[5], r3: r[12], r12: r[13] } : null; }
function findName(code) {
  const v = DAY && DAY.sessions ? DAY.sessions[sel] || {} : {};
  for (const k of ['top500', 'topAmount', 'down5', 'rs15']) { const r = L(v[k]).find(x => x.code === code); if (r) return r; }
  const nh = ((v.indicators || {}).newHigh || {}).top || [], nl = ((v.indicators || {}).newLow || {}).top || [];
  const t = nh.concat(nl).find(x => x.code === code); if (t) return t;
  for (const th of L(v.themes)) { const s = L(th.stocks).find(x => x.code === code); if (s) return s; }
  return null;
}
async function openStock(code) {
  openModal('<p class="mut">불러오는 중…</p>');
  const info = await getJ(`stocks/${code}.json`) || {};
  const hr = heatRow(code), fr = findName(code) || {};
  const b = Object.assign({}, hr || {}, info.basic || {});
  if (hr && hr.sector && !b.sector) b.sector = hr.sector;
  const sp = HEAT && b.sector ? (HEAT.sectorPer || {})[`${b.market || info.market}|${b.sector}`] : null;
  const name = info.name || (hr && hr.name) || fr.name || code, market = info.market || (hr && hr.market) || fr.market || '';
  const nv = NAVER(code), f1 = v => v == null ? '-' : (+v).toLocaleString(undefined, { maximumFractionDigits: 2 });
  let h = `<h2 style="border:0;padding:0;font-size:18px">${esc(name)} ${mkBadge(market)} <small class="mut">${esc(code)}</small></h2>
    <div class="btns"><a class="nv" href="${nv.chart}" target="_blank" rel="noopener">네이버증권 일봉 차트 ↗</a><a href="${nv.main}" target="_blank" rel="noopener">네이버 종목 홈 ↗</a></div>
    <div class="kv"><div><small>PER</small><b>${f1(b.per)}</b></div><div><small>업종 PER(추정)</small><b>${sp && sp.per ? sp.per : (b.sectorPer ?? '-')}</b></div>
      <div><small>PBR</small><b>${f1(b.pbr)}</b></div><div><small>ROE(%)</small><b>${f1(b.roe)}</b></div>
      <div><small>시가총액</small><b>${b.cap ? won0(b.cap) : '-'}</b></div><div><small>업종</small><b style="font-size:13px">${esc(b.sector || '-')}</b></div>
      <div><small>RS(1~99)</small><b>${b.rs ?? '-'}</b></div><div><small>3개월 / 12개월</small><b style="font-size:13px">${b.r3 != null ? b.r3 + '%' : '-'} / ${b.r12 != null ? b.r12 + '%' : '-'}</b></div>
      ${b.for != null ? `<div><small>외국인 소진율</small><b>${f1(b.for)}%</b></div>` : ''}${fr.pct != null || hr ? `<div><small>오늘 등락</small><b>${pctn(fr.pct ?? (hr && hr.pct))}</b></div>` : ''}</div>
    <p class="mut" style="margin-top:0">PER·PBR·ROE: 키움 주식기본정보${(info.basic || {}).date ? ` (${esc(info.basic.date)})` : (hr ? ` (히트맵 ${esc(HEAT.metaDate || '')})` : '')}. 업종 PER은 같은 업종 흑자 종목의 시총가중 추정치.</p>`;
  const pf = info.profile || {}, biz = info.biz || {}, fin = info.fin || {};
  if (pf.ceo || pf.est) h += `<p class="mut" style="margin:4px 0 10px">대표 ${esc(pf.ceo)} · 설립 ${esc(pf.est)} · 결산 ${esc(pf.fiscal)}${pf.home ? ` · <a href="${/^https?:/.test(pf.home) ? esc(pf.home) : 'http://' + esc(pf.home)}" target="_blank" rel="noopener">홈페이지</a>` : ''}</p>`;
  if (!info.code) { h += `<p class="mut">이 종목은 아직 상세 자료(기업 개요·재무·주가 기록)가 없습니다. 다음 수집에서 목록에 오르면 만들어집니다. 차트는 위 네이버 버튼으로 확인하세요.</p>`; openModal(h); return; }
  h += '<h3>기업 개요 <small class="mut">(DART 사업보고서 ‘사업의 개요’ 앞부분 발췌)</small></h3>';
  h += biz.text ? `<div class="biz">${esc(biz.text)}</div><p class="mut">출처: <a href="${esc(biz.url)}" target="_blank" rel="noopener">${esc(biz.report)} · 제출 ${esc(String(biz.date || '').replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'))}</a></p>`
    : `<p class="mut">${esc(info.dartNote || (biz.none ? 'DART에서 사업보고서를 찾지 못했습니다.' : 'DART 키 설정 후 다음 수집부터 표시됩니다.'))}</p>`;
  h += `<h3>최근 3년 재무 <small class="mut">${fin.basis ? esc(fin.basis) + ' 기준 · ' : ''}사업보고서 · DART</small></h3>` + (fin.years
    ? `<div class="grid2"><div class="card">${finChart(fin, [['매출액', 'revenue', 'var(--s1)']])}</div><div class="card">${finChart(fin, [['영업이익', 'op', 'var(--s2)'], ['순이익', 'net', 'var(--s3)']])}</div></div>` + finTable(fin) : `<p class="mut">${fin.none ? '재무 자료 없음' : 'DART 키 설정 후 표시됩니다.'}</p>`);
  h += '<h3>최근 주가 흐름</h3>' + priceChart(info);
  const ap = L(info.appear).slice().reverse();
  h += '<h3>이 사이트 등장 기록 (최근 이슈)</h3>' + tbl(['날짜', '목록', '등락 / 종가', '거래대금', '사유·기사'], ap.map(a => [
    `<a href="#${esc(a.date)}" onclick="hideModal()">${esc(a.date)}</a><br><small class="mut">${esc(SN[a.session] || '')}</small>`,
    esc(a.label) + ` ${a.rank}위`, pct(a.price) + `<br><small class="mut">${esc(a.chg)} · ${esc(a.close)}원</small>`,
    esc(a.amount) + (a.r20 ? `<br><small class="mut">1달 평균의 ${Number(a.r20).toFixed(1)}배</small>` : ''), newsCell(a)]));
  h += `<p class="mut">갱신 ${esc(info.updated)} · 투자 판단 자료가 아니라 기록용 요약입니다.</p>`;
  openModal(h);
}

function pick(k) { sel = k; render(); }
function addMemo() {
  const t = $('txt').value.trim(); if (!t) return;
  const a = load('memo_' + cur);
  a.unshift({ tag: $('tag').value, text: t, time: new Date().toLocaleString('ko-KR') });
  save('memo_' + cur, a); render();
}
function delMemo(i) { const a = load('memo_' + cur); a.splice(i, 1); save('memo_' + cur, a); setTimeout(render, 0); }
window.addEventListener('hashchange', () => { hideModal(); render(); });
render();
</script></body></html>
