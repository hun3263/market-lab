<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데일리 시황 아카이브</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;background:#f4f6f9;color:#1e293b;display:flex;min-height:100vh}
aside{width:240px;background:#0f172a;color:#e2e8f0;padding:16px;flex-shrink:0;overflow-y:auto;height:100vh;position:sticky;top:0}
aside h1{font-size:16px;margin:0 0 12px}aside a{display:block;padding:8px 10px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-size:13px;margin-bottom:4px}
aside a.on{background:#2563eb;color:#fff}aside small{display:block;color:#94a3b8;font-size:11px}aside a.on small{color:#dbeafe}
main{flex:1;min-width:0;padding:20px;max-width:1000px}main h1{font-size:19px}
section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px;border-left:4px solid #2563eb;padding-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}th{background:#f8fafc;color:#64748b;font-size:12px}
td:first-child,th:first-child{white-space:nowrap}section ul,section ol{font-size:14px;line-height:1.6;padding-left:20px}
.up{color:#e11d48;font-weight:700}.dn{color:#2563eb;font-weight:700}
textarea{width:100%;min-height:70px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:8px 0}
select,button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1}button{background:#2563eb;color:#fff;border:0;cursor:pointer}
.memo{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin-top:8px;font-size:13px;white-space:pre-wrap}
@media(max-width:700px){body{flex-direction:column}aside{width:100%;height:auto;position:static}main{padding:12px}th,td{padding:6px 5px;font-size:12px}}
</style></head>
<body>
<aside><h1>📈 데일리 시황</h1><div id="nav"></div><a href="journal.html" style="margin-top:12px;border:1px solid #334155">📒 매매일지</a></aside>
<main id="view"></main>
<script>
const DATA = /*__DATA__*/[];   // generate.py 가 이 자리에 data 폴더의 내용을 채워 넣습니다
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => `<span class="${String(v).trim().startsWith('-') ? 'dn' : 'up'}">${esc(v)}</span>`;
const NS = 'mlab:';   // 같은 github.io 주소의 다른 사이트와 저장 칸이 섞이지 않도록 붙이는 이름표
const load = k => { try { return JSON.parse(localStorage.getItem(NS + k)) || []; } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} };
const L = a => a || [];
const tbl = (head, rows) => !rows.length ? '<p style="font-size:13px;color:#64748b">수집된 데이터가 없습니다.</p>' : '<div style="overflow-x:auto"><table><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr>' + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table></div>';
const sec = (t, h) => `<section><h2>${t}</h2>${h}</section>`;
let cur = null;

function render() {
  const d = DATA.find(x => x.date === location.hash.slice(1)) || DATA[0];
  if (!d) { $('view').innerHTML = sec('아직 데이터가 없습니다', 'data 폴더에 날짜.json 파일을 추가하세요.'); return; }
  cur = d.date;
  $('nav').innerHTML = DATA.map(x => `<a href="#${esc(x.date)}" class="${x.date === cur ? 'on' : ''}">${esc(x.date)}<small>${esc(x.headline)}</small><small>💬 ${load('memo_' + x.date).length}</small></a>`).join('');
  let h = `<h1>${esc(d.date)} · ${esc(d.headline)}</h1>`;
  h += sec('1. 국내 지수 마감 · 종합 시황',
    tbl(['구분','종가','등락','거래대금','투자자별 순매수'], L(d.indices).map(i => [esc(i.name), esc(i.close), pct(i.change), esc(i.value), esc(i.flow)])) +
    '<ul>' + L(d.summary).map(s => `<li>${esc(s)}</li>`).join('') + '</ul>' +
    (L(d.notes).length ? '<p style="font-size:12px;color:#64748b">' + L(d.notes).map(esc).join('<br>') + '</p>' : ''));
  const px = r => pct(r.price) + (r.close ? '<br><small>' + esc(r.close) + '원</small>' : '');
  h += sec('2. 거래대금 500억↑ & 상승률 TOP15', tbl(['#','종목','등락률 · 현재가','거래대금','핵심 상승 사유'], L(d.top500).map((r, i) => [i + 1, esc(r.name), px(r), esc(r.amount), esc(r.reason)])));
  h += sec('3. 테마별 묶음', tbl(['테마','종목(등락률)','대응 원칙'], L(d.themes).map(t => [esc(t.name), esc(t.stocks), esc(t.action)])));
  h += sec('4. 합산 거래대금 TOP15', tbl(['#','종목','등락률 · 현재가','거래대금','변동 원인'], L(d.topAmount).map((r, i) => [i + 1, esc(r.name), px(r), esc(r.amount), esc(r.reason)])));
  if (d.study) h += sec('5. 오늘의 심화 스터디 · ' + esc(d.study.title), '<ol>' + L(d.study.points).map(p => `<li>${esc(p)}</li>`).join('') + '</ol>');
  if (L(d.ideas).length) h += sec('6. 매매 아이디어 후보 (→ 매매일지)', tbl(['종목','내러티브','일지'], d.ideas.map(i => [esc(i.stock), esc(i.narrative), `<a href="journal.html?stock=${encodeURIComponent(i.stock)}&narr=${encodeURIComponent(i.narrative)}&date=${d.date}">카드 만들기</a>`])));
  h += `<section><h2>💬 생각 · 피드백 메모 <small>(이 브라우저에만 저장됨)</small></h2>
    <select id="tag"><option>시장생각</option><option>종목체크</option><option>피드백</option></select>
    <textarea id="txt" placeholder="오늘 시황을 보고 든 생각, 내일 대응 계획..."></textarea>
    <button onclick="addMemo()">등록</button>
    <div>${load('memo_' + cur).map((m, i) => `<div class="memo"><b>[${esc(m.tag)}]</b> ${esc(m.time)} <a href="#${cur}" onclick="delMemo(${i})">삭제</a>\n${esc(m.text)}</div>`).join('')}</div></section>`;
  $('view').innerHTML = h;
}
function addMemo() {
  const t = $('txt').value.trim(); if (!t) return;
  const a = load('memo_' + cur);
  a.unshift({ tag: $('tag').value, text: t, time: new Date().toLocaleString('ko-KR') });
  save('memo_' + cur, a); render();
}
function delMemo(i) { const a = load('memo_' + cur); a.splice(i, 1); save('memo_' + cur, a); setTimeout(render, 0); }
window.addEventListener('hashchange', render);
render();
</script></body></html>
